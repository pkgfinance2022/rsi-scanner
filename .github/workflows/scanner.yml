name: RSI 4H scanner

on:
  schedule:
    - cron: "5 * * * *"        # every hour at :05 (UTC); duplicates are suppressed by the saved state
  workflow_dispatch:
    inputs:
      test:
        description: "Send one test Telegram message instead of scanning"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore sent-alerts state
        uses: actions/cache@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-
      - name: Telegram test
        if: ${{ github.event.inputs.test == 'true' }}
        run: python rsi_tracker_scanner.py --test-telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Scan
        if: ${{ github.event.inputs.test != 'true' }}
        run: python rsi_tracker_scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
